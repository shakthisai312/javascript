<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="campus.css">
 
</head>
<body>
 <script src="campus.js" defer></script>

  <main class="todo-card">
    <h1>My To-Do List</h1>
    <form id="todo-form">
      <label class="visually-hidden" for="task-input">New task</label>
      <input id="task-input" type="text" placeholder="Enter task">
      <button type="submit">Add task</button>
    </form>
    <br><br>
    <small><h1>MY TASK</h1></small>
    <p id="message" class="message" aria-live="polite"></p>
    <ul id="task-list" aria-label="Tasks"></ul>
    <button type="button" id="clear-all">Clear All Tasks</button>

  </main>
</body>
</html>
